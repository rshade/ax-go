name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# Container jobs default run steps to `sh`; restore bash. See ci.yml.
defaults:
  run:
    shell: bash

jobs:
  release-please:
    runs-on: [self-hosted, linux, x64]
    container:
      image: ghcr.io/rshade/ci-ax-go:latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # Use PAT to allow release events to trigger other workflows (e.g., GoReleaser)
          # GITHUB_TOKEN events don't trigger other workflows by design
          # See: https://github.com/googleapis/release-please-action#github-credentials
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Note: Using manifest-based configuration
          # The release-please-config.json and .release-please-manifest.json files
          # in the repo root will be used automatically
